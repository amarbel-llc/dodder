# conformist (treefmt successor) configuration. Canonical formatter driver for
# the repo, replacing the old `just go/codemod-go-fmt` goimports+gofumpt pair.
# Run via `conformist` (repair, applies fixes) or `conformist check` (read-only,
# exits non-zero on drift). The justfile resolves the wrapped binary
# (go/default.nix `treelint-fmt`, which bundles the formatters below on PATH)
# via `nix build '..#treelint-fmt'`.
#
# dodder OWNS this config on purpose: eng's cwd-aware `conformist` wrapper
# recognizes only conformist.toml/.conformist.toml/treefmt.toml at the git root
# and otherwise falls back to eng's baked catch-all. This file's presence pins
# dodder's formatter set here so the catch-all can never silently restyle
# content-addressed or frozen files (see amarbel-llc/eng#222). It supersedes the
# retired treelint.toml, whose filename the wrapper no longer discovers.

# Generated / locked / prose / frozen test data — not formatted.
excludes = [
  "flake.lock",
  # go.sum / gomod2nix.toml live under go/, and conformist compiles excludes via
  # gobwas/glob: a bare literal (no `*`) only matches that exact root-relative
  # path, so the basename alone would silently miss the nested file. Spell the
  # path. (gomod2nix.toml matters now that [formatter.tommy] formats *.toml.)
  "go/go.sum",
  "go/gomod2nix.toml",
  "LICENSE",
  "*.md",
  "result",
  "result-*",
  ".tmp/**",
  ".direnv/**",
  "go/build/**",
  # Frozen fixtures + snapshotted bats suites. Reformatting these would break
  # migration conformance (previous_versions/main.bats) and fixture hashes.
  "zz-tests_bats/previous_versions/**",
  # conformist's own config has intentional layout; leave it be.
  "conformist.toml",
]

# Go: goimports (priority 1) runs before gofumpt (priority 2) so gofumpt
# re-canonicalizes the import-grouped output. -w writes in place (required for
# conformist's sandbox check to observe drift). Matches the dev-shell's igloo
# gofumpt/gotools builds so output is identical to the old codemod-go-fmt.

[formatter.goimports]
command = "goimports"
options = ["-w"]
includes = ["*.go"]
priority = 1

[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]
priority = 2

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

# Project shell style: 2-space indent, simplify, case-branch indent. -w writes.
# *.bats is included (matches eng's catch-all shfmt lane); the frozen snapshot
# suites under zz-tests_bats/previous_versions/** stay excluded above so
# migration conformance and fixture hashes are unaffected.

[formatter.shfmt]
command = "shfmt"
options = ["-w", "-i", "2", "-s", "-ci"]
includes = ["*.sh", "*.bash", "*.bats"]

# Lua via stylua. No options → stylua's defaults (tab indentation), matching
# eng's catch-all so the adopted style is byte-stable across dodder and eng.
# The embedded pandoc lua filters are go:embed'd and content-addressed, so this
# lane's output feeds the pinned blob digests in
# zz-tests_bats/current_version/format_pandoc.bats.

[formatter.stylua]
command = "stylua"
includes = ["*.lua"]

# Rust via rustfmt for the rust/ tree. Options mirror eng's catch-all
# (skip_children keeps rustfmt from recursing mod files it wasn't handed;
# edition 2024 matches the crate).

[formatter.rustfmt]
command = "rustfmt"
options = ["--config", "skip_children=true", "--edition", "2024"]
includes = ["*.rs"]

# TOML via tommy's CST-preserving formatter (`tommy fmt`). conformist.toml
# itself is excluded above (intentional layout).

[formatter.tommy]
command = "tommy"
options = ["fmt"]
includes = ["*.toml"]

# NOTE: no [linter.*] lanes here, on purpose. This file is ALSO read by eng's
# shared conformist-repair / conformist-pre-commit hooks (the spinclass
# merge-repair phase + the per-commit hook), whose wrapper carries only the
# standard FORMATTER toolchain — it has no `shellcheck` and no
# `conformist-tommy-codegen`. A linter whose command/repair-command isn't on that
# wrapper's PATH hard-fails at linter INIT and blocks the merge (see
# amarbel-llc/eng#222). The retired treelint.toml carried a shellcheck linter and
# a tommy-codegen repair lane; both are dropped here. Tommy codegen regen still
# runs via `just build-go-generate` / `just commit-codegen` (the canonical path).
# Restoring shellcheck as a standalone dodder gate is tracked as a followup.
